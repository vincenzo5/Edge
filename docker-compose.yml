name: edge

services:
  postgres:
    image: postgres:16-alpine
    container_name: edge-postgres
    restart: unless-stopped
    networks:
      - edge-net
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: tvai
      POSTGRES_PASSWORD: tvai
      POSTGRES_DB: tvai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvai -d tvai"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: edge-redis
    restart: unless-stopped
    networks:
      - edge-net
    ports:
      - "127.0.0.1:6379:6379"
    # Ephemeral market-data cache — app-owned LRU in redisEviction.ts (not allkeys-lru).
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app-prod:
    image: ${EDGE_APP_IMAGE:?EDGE_APP_IMAGE must be edge-app:<full-git-sha>}
    profiles:
      - prod
    container_name: edge-app-prod
    restart: unless-stopped
    networks:
      - edge-net
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .edge/local-prod/production.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/journal-screenshots:/app/data/journal-screenshots
      - ./data/copilot-attachments:/app/data/copilot-attachments
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app-prod-migrate:
    image: ${EDGE_APP_IMAGE:?EDGE_APP_IMAGE must be edge-app:<full-git-sha>}-migrate
    profiles:
      - migrate
    restart: "no"
    networks:
      - edge-net
    env_file:
      - .edge/local-prod/production.env
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge-net:

volumes:
  postgres_data:
