name: Chart perf budgets

on:
  pull_request:
    paths:
      - "packages/**"
      - "examples/chart-perf-harness/**"
      - "scripts/run-chart-perf.mts"
      - "scripts/chart-perf-budgets.ts"
      - "docs/perf/runtime-interaction-baseline-latest.json"
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "examples/chart-perf-harness/**"
      - "scripts/run-chart-perf.mts"
      - "scripts/chart-perf-budgets.ts"
      - "docs/perf/runtime-interaction-baseline-latest.json"

jobs:
  chart-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run chart perf with strict budgets
        env:
          CHART_PERF_BUDGET_STRICT: "1"
        run: npm run perf:chart

      - name: Upload interaction baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-interaction-baseline
          path: docs/perf/runtime-interaction-baseline-latest.json
